name: Release

# Publishes with NuGet trusted publishing (OIDC). There is no long-lived API key anywhere in this
# repository: the workflow exchanges a GitHub OIDC token for a short-lived key, which nuget.org only
# issues when the token matches a trusted publishing policy on the account.
#
# One-time setup, on nuget.org: sign in, click your username, then Trusted Publishing, and add a policy.
#   Repository owner : dogukandemir
#   Repository       : OpenApiFeatureFlags
#   Workflow file    : release.yml            <- the file name only, no .github/workflows/ prefix
#   Environment      : release                <- must match `environment:` on the publish job below
#   Package scopes   : OpenApiFeatureFlags*   <- limits what the policy can publish
#
# Then, in GitHub: Settings, Environments, create an environment named `release`, and add a secret to
# it named NUGET_USER holding the nuget.org *username* (the profile name) -- not the email address.
# That environment is also the place for protection rules, such as requiring a reviewer to approve a
# publish. Without them the environment is just a name.
#
# To release, tag the commit whose VersionPrefix you are shipping and push the tag:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match VersionPrefix in Directory.Build.props, or the run stops before publishing.
# A manual workflow_dispatch run skips that check, which is the fallback if a tag-triggered run is
# rejected by the policy.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for the OIDC exchange

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SourceLink needs history; the workflow never pushes to git.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      # A release must not go out on a red test suite, on any target framework.
      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output ${{ github.workspace }}/artifacts

      # A tag release must match the version being packed. A manual dispatch carries no tag, so it is
      # let through: GITHUB_REF_TYPE is what distinguishes the two, because on workflow_dispatch
      # GITHUB_REF_NAME is the branch name and a "is the ref non-empty" test would always fail.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(dotnet msbuild Directory.Build.props -getProperty:VersionPrefix)"
          echo "package version: $version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' does not match VersionPrefix '$version'"
              exit 1
            fi
          else
            echo "ref type '${GITHUB_REF_TYPE:-unknown}' is not a tag, so the version check is skipped"
          fi

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The packages are built with IncludeSymbols/snupkg, so without this step the debugger would
      # step over this library on nuget.org with "source not available". Symbols must follow the
      # package that carries them, hence the second push rather than a single glob.
      - name: Push symbols to nuget.org
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.snupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: ${{ github.workspace }}/artifacts/*.*nupkg
