name: Release

# Publishes with NuGet trusted publishing (OIDC). There is no long-lived API key anywhere in this
# repository: the workflow exchanges a GitHub OIDC token for a short-lived key, which nuget.org only
# issues when the token matches a trusted publishing policy on the account.
#
# One-time setup, on nuget.org: sign in, click your username, then Trusted Publishing, and add a policy.
#   Repository owner : dogukandemir
#   Repository       : OpenApiFeatureFlags
#   Workflow file    : release.yml            <- the file name only, no .github/workflows/ prefix
#   Environment      : release                <- must match `environment:` on the publish job below
#   Package scopes   : OpenApiFeatureFlags*   <- limits what the policy can publish
#
# Then, in GitHub: Settings, Environments, create an environment named `release`, and add a secret to
# it named NUGET_USER holding the nuget.org *username* (the profile name) -- not the email address.
# That environment is also the place for protection rules, such as requiring a reviewer to approve a
# publish. Without them the environment is just a name.
#
# To release, tag the commit whose VersionPrefix you are shipping and push the tag:
#   git tag v<version> && git push origin v<version>
# The tag must match VersionPrefix in Directory.Build.props, or the run stops before publishing.
# A manual workflow_dispatch run skips that check, which is the fallback if a tag-triggered run is
# rejected by the policy.
#
# After a successful publish, the `finalize` job creates the GitHub release (its notes are the
# version's section of CHANGELOG.md) and refreshes assets/badge-nuget.svg on main, so the README
# badge reads the live version without depending on a third-party image host.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# One release at a time, and a release is never cancelled: a half-finished publish cannot be
# rolled back, so a second run waits instead of overlapping.
concurrency:
  group: release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required for the OIDC exchange

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SourceLink needs history; the publish job never pushes to git (only the finalize job below).
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      # A release must not go out on a red test suite, on any target framework.
      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack --configuration Release --output ${{ github.workspace }}/artifacts

      # A tag release must match the version being packed. A manual dispatch carries no tag, so it is
      # let through: GITHUB_REF_TYPE is what distinguishes the two, because on workflow_dispatch
      # GITHUB_REF_NAME is the branch name and a "is the ref non-empty" test would always fail.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(dotnet msbuild Directory.Build.props -getProperty:VersionPrefix)"
          echo "package version: $version"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' does not match VersionPrefix '$version'"
              exit 1
            fi
          else
            echo "ref type '${GITHUB_REF_TYPE:-unknown}' is not a tag, so the version check is skipped"
          fi

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # The packages are built with IncludeSymbols/snupkg, so without this step the debugger would
      # step over this library on nuget.org with "source not available". Symbols must follow the
      # package that carries them, hence the second push rather than a single glob.
      - name: Push symbols to nuget.org
        run: >-
          dotnet nuget push "${{ github.workspace }}/artifacts/*.snupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: ${{ github.workspace }}/artifacts/*.*nupkg

  # Closes out a release: the GitHub release is created from the tag, with notes taken from the
  # version's CHANGELOG.md section, and the README's NuGet badge is refreshed on main. Release
  # creation is safe to re-run (an existing release for the tag is left alone); the badge push is
  # best-effort, because a stale badge must never fail an otherwise successful release.
  finalize:
    name: Finalize the release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "a release for $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v prefix="## [${version}]" '
            index($0, prefix) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes"

          if [ ! -s "$notes" ]; then
            echo "no CHANGELOG section for ${version}; falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi

      - name: Refresh the NuGet badge and push it to main
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/make-nuget-badge.py "$version" > assets/badge-nuget.svg
          if git diff --quiet -- assets/badge-nuget.svg; then
            echo "the badge already shows v${version}; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/badge-nuget.svg
          git commit -m "Update the NuGet badge to v${version}"
          git push origin "HEAD:main" || \
            echo "::warning::main moved since the tag was cut; the badge refreshes on the next release"
