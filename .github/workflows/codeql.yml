name: CodeQL

# Static analysis on every change and once a week. The weekly run matters because new queries land
# without this repository changing at all, so a clean pass today says nothing about next month.
# Code scanning is free for public repositories.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      # Required to upload the results to code scanning.
      security-events: write
      # Required to fetch CodeQL query packs.
      packages: read
      # Required for the action to read workflow run metadata.
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CodeQL builds the projects, so the SDK has to be present before init runs autobuild.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: csharp
          build-mode: autobuild
          # Security-focused rather than security-and-quality: quality alerts on a library this size
          # are noise, and noise is what trains people to ignore the results.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:csharp
