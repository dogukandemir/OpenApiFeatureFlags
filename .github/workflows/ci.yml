name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege. CI only reads the repository, so it says so rather than inheriting whatever the
# repository default happens to be (which for older repositories is read/write).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: build + test (${{ matrix.tfm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net8.0, net9.0, net10.0 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SourceLink needs history, not credentials: this job never pushes.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # D14 acceptance: every target framework builds and passes.
      # Test projects run on xunit.v3 + Microsoft.Testing.Platform, which the .NET 10
      # SDK selects through global.json (test.runner). In that mode --logger and
      # --framework are not valid arguments, and unknown options are forwarded to the
      # test application, so the target framework is passed as an MSBuild property.
      #
      # Projects are tested one at a time so that one which does not target the matrix
      # framework can be skipped. OpenApiFeatureFlags.AspNetCore is net10.0 only because
      # the engine's 8.x and 9.x lines sit on the Microsoft.OpenApi 1.x document model, a
      # different set of types, so multi-targeting it would mean three implementations
      # (docs/design.md 4.4). Forcing net8.0 onto it is NETSDK1005, a configuration error
      # rather than a test failure, which would drown out the signal this matrix exists to
      # give.
      - name: Test (${{ matrix.tfm }})
        shell: bash
        run: |
          set -euo pipefail

          for project in tests/*/*.csproj; do
            frameworks="$(dotnet msbuild "$project" -getProperty:TargetFrameworks)"
            if [[ ",$frameworks," != *",${{ matrix.tfm }},"* ]]; then
              echo "skipping $project: targets $frameworks, not ${{ matrix.tfm }}"
              continue
            fi

            echo "testing $project for ${{ matrix.tfm }}"
            dotnet test --project "$project" --configuration Release -p:TargetFramework=${{ matrix.tfm }}
          done

  format:
    name: format (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # .editorconfig is only advisory until something enforces it. Without this the first
      # contributor whose IDE formats differently turns every later diff into a style argument.
      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  pack:
    name: pack (validates packaging metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # Pack the projects under src/ rather than the solution: the solution also contains the sample,
      # which is deliberately not packable and would emit a nuisance warning on every run.
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --output "${{ github.workspace }}/artifacts"
          done

      - name: Verify the packages were produced
        shell: bash
        run: |
          ls -1 "${{ github.workspace }}/artifacts"
          # Exactly one package per project under src/: a lower bound would not notice a project that
          # silently stopped packing.
          test "$(find "${{ github.workspace }}/artifacts" -name '*.nupkg' | wc -l)" -eq 6

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg
          path: ${{ github.workspace }}/artifacts/*.*nupkg
