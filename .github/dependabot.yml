version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      document-engines:
        patterns:
          - "Swashbuckle.*"
          - "NSwag.*"
          - "Microsoft.OpenApi"
          - "Microsoft.AspNetCore.OpenApi"
        update-types:
          - minor
          - patch
      flag-sources:
        patterns:
          - "Microsoft.FeatureManagement*"
          - "OpenFeature*"
        update-types:
          - minor
          - patch
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Shouldly"
          - "NSubstitute"
        update-types:
          - minor
          - patch
      build-tooling:
        patterns:
          - "Microsoft.SourceLink.*"
          - "Microsoft.CodeAnalysis.*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
