<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenApiFeatureFlags</title>
<style>
  :root {
    --bg: #002b36;
    --text: #93a1a1;
    --text-strong: #eee8d5;
    --accent: #2aa198;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100vh; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    padding: 0 96px;
  }
  img { width: 168px; height: 168px; border-radius: 32px; box-shadow: 0 0 0 2px rgba(147,161,161,.34); flex: none; }
  .copy { margin-left: 56px; }
  h1 { font-size: 62px; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.05; }
  .tag { margin-top: 14px; font-size: 29px; color: var(--text-strong); opacity: .92; }
  .meta { margin-top: 22px; font-size: 21px; color: var(--text); }
  .meta2 { margin-top: 6px; font-size: 21px; color: var(--text); }
  .meta b { color: var(--accent); font-weight: 600; }
  .rule { width: 84px; height: 4px; background: var(--accent); border-radius: 2px; margin-top: 30px; }
</style>
</head>
<body>
  <img src="assets/icon-256.png" alt="OpenApiFeatureFlags mark">
  <div class="copy">
    <h1>OpenApiFeatureFlags</h1>
    <p class="tag">Feature flags for Swagger and OpenAPI documents on .NET.</p>
    <div class="rule"></div>
    <p class="meta">Swashbuckle &middot; built-in ASP.NET Core &middot; NSwag</p>
    <p class="meta2"><b>8 packages</b> on NuGet &middot; one version &middot; MIT</p>
  </div>
</body>
</html>
